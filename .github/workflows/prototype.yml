name: Prototype tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all standard-library tests
        working-directory: prototype
        run: python -m unittest discover -p "*.py" -v
      - name: Run the prototype demos
        working-directory: prototype
        run: |
          for f in *.py; do
            case "$f" in test_*) continue ;; esac
            python "$f" > /dev/null
          done
